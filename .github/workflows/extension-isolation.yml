name: Extension isolation acceptance
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['swarm/extension*', 'scripts/check_extension_sandbox.py', '.github/workflows/extension-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python scripts/check_extension_sandbox.py
        env:
          SWARM_DISPOSABLE_DOCKER_TEST: '1'
