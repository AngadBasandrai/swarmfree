[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-workbench"
version = "0.6.3"
description = "A local-first, distributed multi-model agent workbench"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.14.0", "psutil==7.2.2", "keyring==25.7.0",
  "nvidia-ml-py==13.615.71", "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1", "platformdirs==4.13.0",
  "pypdf==6.20.0", "cryptography==50.0.2", "zeroconf==0.151.5",
  "qrcode==8.2", "pillow==12.3.0", "jsonschema==4.26.0",
  "playwright==1.63.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
release = ["build>=1.2,<2"]
desktop = ["pyinstaller==6.22.3"]
training = ["torch==2.14.1", "transformers==5.19.0", "peft==0.21.2", "trl==1.15.0", "datasets==5.1.0", "bitsandbytes==0.50.2", "accelerate==1.15.0"]

[project.scripts]
swarm-workbench = "swarm.cli:main"
swarm-worker = "swarm.worker:main"
swarm-hub = "swarm.hub:main"
swarm-restore = "swarm.maintenance:main"
swarm-relay = "swarm.relay:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[tool.setuptools.package-data]
swarm = ["web_dist/*", "web_dist/assets/*", "web_dist/licenses/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
